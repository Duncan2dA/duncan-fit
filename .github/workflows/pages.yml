name: Publiceer Duncan Fit

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Broncode ophalen
        uses: actions/checkout@v4
      - name: Pages instellen
        uses: actions/configure-pages@v5
      - name: Website verpakken
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Publiceren
        id: deployment
        uses: actions/deploy-pages@v4

